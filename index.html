<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Klassenkonto Klasse 8b - Guthaben & Belohnungssystem</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel Standalone CDN -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                        }
                    }
                }
            }
        }
    </script>
    
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #f1f5f9; 
            color: #0f172a; 
            -webkit-tap-highlight-color: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="min-h-screen flex flex-col">
    <div id="root" class="flex-1 flex flex-col"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const STORAGE_KEY = 'klassenkonto_8b_app_state_v2';

        // Die 28 Schülerinnen und Schüler der Klasse 8b
        const DEFAULT_STUDENT_NAMES = [
            'Anna', 'Aurelia', 'Carolin', 'Clemens', 'Ella', 'Filip', 'Flynn', 
            'Jannis', 'Laura', 'Leni', 'Lennart', 'Lenya', 'Linda', 'Linnea', 
            'Linni', 'Luci', 'Maja', 'Martin', 'Mayla', 'Moses', 'Nahla', 
            'Nele', 'Ole', 'Paul', 'Scarlett', 'Sofia', 'Tamme', 'Marlon'
        ];

        const SHOP_ITEMS = [
            { id: 'item-1', title: 'Keine Hausaufgaben', cost: 75, icon: '📝', description: 'Ein hausaufgabenfreier Tag für die gesamte Klasse 8b.' },
            { id: 'item-2', title: 'Gummibärchen-Party', cost: 100, icon: '🍬', description: 'Snack-Pause mit Gummibärchen für alle 28 Schüler.' },
            { id: 'item-3', title: 'Eis für alle', cost: 250, icon: '🍦', description: 'Erfrischendes Eis für die gesamte Klasse 8b.' },
            { id: 'item-4', title: 'Klassenfilm', cost: 400, icon: '🎬', description: 'Gemeinsame Filmstunde mit Popcorn und Snacks.' },
        ];

        const INITIAL_STUDENTS = DEFAULT_STUDENT_NAMES.map((name, index) => ({
            id: `student-${index + 1}`,
            name,
            pin: String(1001 + index) // PINs von 1001 bis 1028
        }));

        const INITIAL_HISTORY = [
            { id: 'h-1', type: 'ADD', amount: 300, note: 'Gutes Verhalten und Ordnung beim Ausflug der 8b', date: '01.10.2026, 09:30', user: 'Lehrkraft' },
            { id: 'h-2', type: 'ADD', amount: 50, note: 'Super Engagement bei der Altpapiersammlung', date: '02.10.2026, 10:15', user: 'Lehrkraft' }
        ];

        function App() {
            // Zustand aus localStorage laden oder Standardwerte verwenden
            const [credits, setCredits] = useState(() => {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    try { return JSON.parse(saved).credits ?? 350; } catch (e) {}
                }
                return 350;
            });

            const [students, setStudents] = useState(() => {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    try { return JSON.parse(saved).students ?? INITIAL_STUDENTS; } catch (e) {}
                }
                return INITIAL_STUDENTS;
            });

            const [teacherPassword, setTeacherPassword] = useState(() => {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    try { return JSON.parse(saved).teacherPassword ?? 'lehrer8b'; } catch (e) {}
                }
                return 'lehrer8b';
            });

            const [history, setHistory] = useState(() => {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    try { return JSON.parse(saved).history ?? INITIAL_HISTORY; } catch (e) {}
                }
                return INITIAL_HISTORY;
            });

            const [activeRequest, setActiveRequest] = useState(() => {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    try {
                        const parsed = JSON.parse(saved).activeRequest;
                        if (parsed) {
                            return { ...parsed, approvals: new Set(parsed.approvals || []) };
                        }
                    } catch (e) {}
                }
                return null;
            });

            // Eingeloggter Benutzer state (wird nicht persistent gespeichert, damit Schüler sich anmelden müssen)
            const [currentUser, setCurrentUser] = useState(null); // { role: 'student' | 'teacher', studentData?: Student }
            
            // Login Formulare Inputs
            const [selectedStudentId, setSelectedStudentId] = useState('');
            const [studentPinInput, setStudentPinInput] = useState('');
            const [teacherPasswordInput, setTeacherPasswordInput] = useState('');

            // Lehrerbereich Untertab & PIN-Sichtbarkeit
            const [showTeacherPins, setShowTeacherPins] = useState(false);
            const [editingStudent, setEditingStudent] = useState(null); // student object or null

            // Toast Benachrichtigungen
            const [toast, setToast] = useState(null);

            // In localStorage speichern bei Änderungen
            useEffect(() => {
                const stateToSave = {
                    credits,
                    students,
                    teacherPassword,
                    history,
                    activeRequest: activeRequest ? {
                        ...activeRequest,
                        approvals: Array.from(activeRequest.approvals)
                    } : null
                };
                localStorage.setItem(STORAGE_KEY, JSON.stringify(stateToSave));
            }, [credits, students, teacherPassword, history, activeRequest]);

            const showToastMessage = (message, type = 'success') => {
                setToast({ message, type });
                setTimeout(() => setToast(null), 3800);
            };

            // Login Handlers
            const handleStudentLogin = (e) => {
                e.preventDefault();
                if (!selectedStudentId) {
                    showToastMessage('Bitte wähle zuerst deinen Namen aus.', 'error');
                    return;
                }
                const student = students.find(s => s.id === selectedStudentId);
                if (!student) return;

                if (student.pin.trim() === studentPinInput.trim()) {
                    setCurrentUser({ role: 'student', studentData: student });
                    setStudentPinInput('');
                    showToastMessage(`Willkommen zurück, ${student.name}! 👋`);
                } else {
                    showToastMessage('Falscher PIN! Bitte frage deine Lehrkraft.', 'error');
                }
            };

            const handleTeacherLogin = (e) => {
                e.preventDefault();
                if (teacherPasswordInput === teacherPassword) {
                    setCurrentUser({ role: 'teacher' });
                    setTeacherPasswordInput('');
                    showToastMessage('Erfolgreich als Lehrkraft angemeldet.');
                } else {
                    showToastMessage('Falsches Lehrer-Passwort!', 'error');
                }
            };

            const handleLogout = () => {
                setCurrentUser(null);
                setSelectedStudentId('');
                setStudentPinInput('');
                setTeacherPasswordInput('');
                showToastMessage('Erfolgreich abgemeldet.');
            };

            // Kaufantrag starten
            const handleProposePurchase = (item) => {
                if (credits < item.cost) {
                    showToastMessage('Nicht genügend Credits vorhanden!', 'error');
                    return;
                }
                if (activeRequest) {
                    showToastMessage('Es läuft bereits ein offener Kaufantrag.', 'error');
                    return;
                }

                const initialApprovals = new Set();
                if (currentUser?.role === 'student') {
                    initialApprovals.add(currentUser.studentData.id);
                }

                const newRequest = {
                    id: `req-${Date.now()}`,
                    item,
                    approvals: initialApprovals,
                    proposedBy: currentUser?.role === 'student' ? currentUser.studentData.name : 'Lehrkraft',
                    date: new Date().toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' })
                };

                setActiveRequest(newRequest);
                showToastMessage(`Kaufantrag für "${item.title}" wurde gestartet!`);
            };

            // Abstimmung abgeben
            const handleVote = (studentId) => {
                if (!activeRequest) return;

                const updatedApprovals = new Set(activeRequest.approvals);
                if (updatedApprovals.has(studentId)) {
                    showToastMessage('Du hast bereits zugestimmt.', 'info');
                    return;
                }

                updatedApprovals.add(studentId);

                // Prüfen ob genau 28/28 zugestimmt haben!
                if (updatedApprovals.size >= students.length) {
                    if (credits >= activeRequest.item.cost) {
                        const newCredits = credits - activeRequest.item.cost;
                        setCredits(newCredits);

                        const historyEntry = {
                            id: `h-${Date.now()}`,
                            type: 'PURCHASE',
                            amount: activeRequest.item.cost,
                            note: `Kauf von "${activeRequest.item.title}" (100% Einstimmigkeit von allen 28 Schülern)`,
                            date: new Date().toLocaleString('de-DE'),
                            user: 'Klasse 8b'
                        };

                        setHistory([historyEntry, ...history]);
                        setActiveRequest(null);
                        showToastMessage(`🎉 EINSTIMMIG! Die Klasse 8b hat "${activeRequest.item.title}" erfolgreich erworben!`, 'success');
                    } else {
                        showToastMessage('Guthaben reicht für diesen Kauf nicht mehr aus.', 'error');
                        setActiveRequest(null);
                    }
                } else {
                    setActiveRequest({ ...activeRequest, approvals: updatedApprovals });
                    showToastMessage(`Zusage erfasst! (${updatedApprovals.size} von ${students.length} Zusagen)`);
                }
            };

            // Lehrer-Aktionen
            const handleAddCredits = (amount, note) => {
                const num = parseInt(amount, 10);
                if (isNaN(num) || num === 0) {
                    showToastMessage('Bitte gib einen gültigen Betrag ein.', 'error');
                    return;
                }

                const newTotal = credits + num;
                if (newTotal < 0) {
                    showToastMessage('Das Guthaben darf nicht negativ werden!', 'error');
                    return;
                }

                setCredits(newTotal);
                const historyEntry = {
                    id: `h-${Date.now()}`,
                    type: num > 0 ? 'ADD' : 'SUB',
                    amount: Math.abs(num),
                    note: note.trim() || (num > 0 ? 'Guthaben aufgebucht' : 'Korrektur durch Lehrkraft'),
                    date: new Date().toLocaleString('de-DE'),
                    user: 'Lehrkraft'
                };
                setHistory([historyEntry, ...history]);
                showToastMessage(`${Math.abs(num)} CR ${num > 0 ? 'gutgeschrieben' : 'abgezogen'}.`);
            };

            const handleCancelRequest = () => {
                setActiveRequest(null);
                showToastMessage('Der Kaufantrag wurde von der Lehrkraft storniert.', 'info');
            };

            const handleUpdateStudentPin = (studentId, newPin) => {
                if (!newPin || newPin.trim().length < 3) {
                    showToastMessage('Der PIN sollte mindestens 3 Zeichen lang sein.', 'error');
                    return;
                }
                setStudents(students.map(s => s.id === studentId ? { ...s, pin: newPin.trim() } : s));
                setEditingStudent(null);
                showToastMessage('PIN erfolgreich geändert.');
            };

            const handleResetAllData = () => {
                if (window.confirm('Möchtest du das Klassenkonto wirklich auf die Standardwerte zurücksetzen?')) {
                    localStorage.removeItem(STORAGE_KEY);
                    setCredits(350);
                    setStudents(INITIAL_STUDENTS);
                    setTeacherPassword('lehrer8b');
                    setHistory(INITIAL_HISTORY);
                    setActiveRequest(null);
                    setCurrentUser(null);
                    showToastMessage('System auf Standardwerte zurückgesetzt.');
                }
            };

            return (
                <div class="flex-1 flex flex-col">
                    {/* Header Banner */}
                    <header class="bg-indigo-700 text-white shadow-lg sticky top-0 z-30">
                        <div class="max-w-6xl mx-auto px-4 py-3.5 flex justify-between items-center">
                            <div class="flex items-center gap-3">
                                <div class="bg-indigo-800/80 p-2.5 rounded-2xl border border-indigo-500/30 text-2xl shadow-inner">
                                    🎓
                                </div>
                                <div>
                                    <div class="flex items-center gap-2">
                                        <h1 class="text-xl font-black tracking-tight">Klassenkonto Klasse 8b</h1>
                                        <span class="bg-indigo-500/30 text-indigo-100 text-[11px] font-bold px-2 py-0.5 rounded-full border border-indigo-400/30">28 Schüler</span>
                                    </div>
                                    <p class="text-xs text-indigo-200">Gemeinsames Guthaben & Einstimmigkeits-System</p>
                                </div>
                            </div>

                            {/* Standard Login Status */}
                            {currentUser ? (
                                <div class="flex items-center gap-2">
                                    <div class="hidden sm:block text-right">
                                        <span class="text-[10px] text-indigo-200 block uppercase font-semibold">Angemeldet als</span>
                                        <span class="text-xs font-bold text-white">
                                            {currentUser.role === 'teacher' ? '👨‍🏫 Lehrkraft' : `🎓 ${currentUser.studentData.name}`}
                                        </span>
                                    </div>
                                    <button 
                                        onClick={handleLogout}
                                        class="bg-indigo-800 hover:bg-indigo-900 text-white font-semibold text-xs px-3 py-2 rounded-xl border border-indigo-500/40 transition shadow-sm">
                                        Abmelden
                                    </button>
                                </div>
                            ) : (
                                <span class="text-xs bg-indigo-800/60 text-indigo-100 px-3 py-1.5 rounded-xl border border-indigo-500/30 font-medium">
                                    🔒 Nicht angemeldet
                                </span>
                            )}
                        </div>
                    </header>

                    {/* Toast Benachrichtigung */}
                    {toast && (
                        <div class="fixed bottom-5 right-5 z-50 animate-bounce max-w-sm">
                            <div class={`px-4 py-3 rounded-2xl shadow-2xl border text-sm font-semibold flex items-center gap-3 ${
                                toast.type === 'error' ? 'bg-red-900 text-red-100 border-red-700' :
                                toast.type === 'info' ? 'bg-blue-900 text-blue-100 border-blue-700' :
                                'bg-emerald-900 text-emerald-100 border-emerald-700'
                            }`}>
                                <span class="text-lg">{toast.type === 'error' ? '⚠️' : toast.type === 'info' ? 'ℹ️' : '✅'}</span>
                                <div>{toast.message}</div>
                            </div>
                        </div>
                    )}

                    {/* Hauptbereich */}
                    <main class="flex-1 max-w-6xl w-full mx-auto p-4 md:p-6 space-y-6">
                        
                        {/* Guthaben Display & Aktiver Antrag Status */}
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-5">
                            {/* Guthaben Anzeige */}
                            <div class="bg-gradient-to-br from-amber-400 via-amber-500 to-orange-600 rounded-3xl p-6 text-white shadow-xl relative overflow-hidden flex flex-col justify-between border border-amber-300/40">
                                <div class="absolute -right-6 -bottom-6 text-white/10 text-9xl font-black select-none pointer-events-none">CR</div>
                                <div>
                                    <span class="text-xs font-bold uppercase tracking-widest text-amber-100/90 bg-black/10 px-2.5 py-1 rounded-full">Klassenguthaben</span>
                                    <div class="text-5xl font-black mt-3 tracking-tight flex items-baseline gap-2">
                                        {credits} <span class="text-2xl font-bold opacity-90">CR</span>
                                    </div>
                                </div>
                                <div class="mt-6 pt-4 border-t border-white/20 flex items-center justify-between text-xs font-medium">
                                    <span>Ziel: Klassenfilm (400 CR)</span>
                                    <span class="font-bold bg-white/20 px-2 py-0.5 rounded-lg">
                                        {credits >= 400 ? 'Erreicht! 🎉' : `Noch ${400 - credits} CR`}
                                    </span>
                                </div>
                            </div>

                            {/* Offener Kaufantrag Box */}
                            <div class="bg-white rounded-3xl p-6 border border-slate-200 shadow-sm flex flex-col justify-between md:col-span-2">
                                {activeRequest ? (
                                    <div class="space-y-4">
                                        <div class="flex justify-between items-start gap-2">
                                            <div>
                                                <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full text-xs font-bold bg-amber-100 text-amber-800 border border-amber-200">
                                                    <span class="w-2 h-2 rounded-full bg-amber-500 animate-ping"></span>
                                                    Laufende Abstimmung (Einstimmigkeit erforderlich)
                                                </div>
                                                <h3 class="text-xl font-extrabold text-slate-800 mt-2 flex items-center gap-2">
                                                    <span>{activeRequest.item.icon}</span>
                                                    <span>{activeRequest.item.title}</span>
                                                    <span class="text-indigo-600 font-bold text-base">({activeRequest.item.cost} CR)</span>
                                                </h3>
                                                <p class="text-xs text-slate-500 mt-0.5">Vorgeschlagen von: <span class="font-semibold text-slate-700">{activeRequest.proposedBy}</span></p>
                                            </div>

                                            {currentUser?.role === 'teacher' && (
                                                <button 
                                                    onClick={handleCancelRequest}
                                                    class="text-xs bg-red-50 text-red-700 hover:bg-red-100 font-bold px-3 py-2 rounded-xl border border-red-200 transition">
                                                    Antrag stornieren
                                                </button>
                                            )}
                                        </div>

                                        {/* Fortschrittsbalken 28/28 */}
                                        <div>
                                            <div class="flex justify-between text-xs font-bold mb-1.5">
                                                <span class="text-indigo-600">Klassen-Zustimmung</span>
                                                <span class="text-slate-700">
                                                    {activeRequest.approvals.size} / {students.length} Zusagen ({Math.round((activeRequest.approvals.size / students.length) * 100)}%)
                                                </span>
                                            </div>
                                            <div class="w-full bg-slate-100 h-4 rounded-full overflow-hidden p-0.5 border border-slate-200">
                                                <div 
                                                    class="bg-indigo-600 h-full rounded-full transition-all duration-500 ease-out shadow-inner" 
                                                    style={{ width: `${(activeRequest.approvals.size / students.length) * 100}%` }}>
                                                </div>
                                            </div>
                                        </div>

                                        {/* Abstimmungs-Aktion für Schüler */}
                                        {currentUser?.role === 'student' && (
                                            <div class="pt-2">
                                                {activeRequest.approvals.has(currentUser.studentData.id) ? (
                                                    <div class="bg-emerald-50 text-emerald-800 border border-emerald-200 text-xs px-4 py-3 rounded-2xl flex items-center justify-between font-bold">
                                                        <span>✅ Du ({currentUser.studentData.name}) hast diesem Kauf zugestimmt!</span>
                                                        <span class="text-emerald-600 text-xl">👍</span>
                                                    </div>
                                                ) : (
                                                    <button 
                                                        onClick={() => handleVote(currentUser.studentData.id)}
                                                        class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold py-3 px-4 rounded-2xl shadow-md hover:shadow-lg transition flex items-center justify-center gap-2 text-sm">
                                                        <span>👍</span> Ich stimme als {currentUser.studentData.name} mit "Zusage" zu
                                                    </button>
                                                )}
                                            </div>
                                        )}

                                        {!currentUser && (
                                            <p class="text-xs text-amber-700 bg-amber-50 p-2.5 rounded-xl border border-amber-200 text-center font-medium">
                                                🔒 Melde dich unten mit deinem Namen an, um deine Zusage für die Klasse abzugeben.
                                            </p>
                                        )}
                                    </div>
                                ) : (
                                    <div class="h-full flex flex-col justify-center items-center text-center py-6">
                                        <div class="w-14 h-14 rounded-2xl bg-indigo-50 border border-indigo-100 flex items-center justify-center text-3xl mb-3 shadow-inner">🛒</div>
                                        <h3 class="text-base font-bold text-slate-800">Kein aktiver Kaufantrag</h3>
                                        <p class="text-xs text-slate-500 max-w-md mt-1">
                                            Jeder Schüler kann unten im Shop einen Kaufantrag starten. Ein Kauf erfordert genau <strong>28 von 28 Zusagen</strong>.
                                        </p>
                                    </div>
                                )}
                            </div>
                        </div>

                        {/* Login Bereiche (sofern nicht angemeldet) */}
                        {!currentUser && (
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                {/* Schüler Login */}
                                <div class="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm space-y-4">
                                    <div class="flex items-center gap-3 border-b border-slate-100 pb-3">
                                        <div class="w-10 h-10 rounded-2xl bg-indigo-100 text-indigo-700 flex items-center justify-center font-bold text-xl">🎓</div>
                                        <div>
                                            <h3 class="font-extrabold text-slate-800">Schüler-Anmeldung</h3>
                                            <p class="text-xs text-slate-400">Wähle deinen Namen aus Klasse 8b</p>
                                        </div>
                                    </div>

                                    <form onSubmit={handleStudentLogin} class="space-y-4">
                                        <div>
                                            <label class="block text-xs font-bold text-slate-700 mb-1">Dein Name</label>
                                            <select 
                                                value={selectedStudentId}
                                                onChange={(e) => setSelectedStudentId(e.target.value)}
                                                class="w-full text-sm border border-slate-200 rounded-2xl px-3.5 py-2.5 bg-slate-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 font-medium">
                                                <option value="">-- Wähle deinen Namen --</option>
                                                {students.map(s => (
                                                    <option key={s.id} value={s.id}>{s.name}</option>
                                                ))}
                                            </select>
                                        </div>

                                        <div>
                                            <label class="block text-xs font-bold text-slate-700 mb-1">Persönlicher 4-stelliger PIN</label>
                                            <input 
                                                type="password"
                                                placeholder="••••"
                                                value={studentPinInput}
                                                onChange={(e) => setStudentPinInput(e.target.value)}
                                                class="w-full text-sm border border-slate-200 rounded-2xl px-3.5 py-2.5 bg-slate-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 font-mono tracking-widest"
                                            />
                                            <p class="text-[10px] text-slate-400 mt-1">🔒 PIN-Eingabe ist vollständig verdeckt und geschützt.</p>
                                        </div>

                                        <button 
                                            type="submit"
                                            class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 rounded-2xl transition shadow-md text-sm">
                                            Als Schüler anmelden
                                        </button>
                                    </form>
                                </div>

                                {/* Lehrer Login */}
                                <div class="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm space-y-4">
                                    <div class="flex items-center gap-3 border-b border-slate-100 pb-3">
                                        <div class="w-10 h-10 rounded-2xl bg-slate-100 text-slate-800 flex items-center justify-center font-bold text-xl">👨‍‍🏫</div>
                                        <div>
                                            <h3 class="font-extrabold text-slate-800">Lehrer-Zugang</h3>
                                            <p class="text-xs text-slate-400">Guthaben buchen & Klasse verwalten</p>
                                        </div>
                                    </div>

                                    <form onSubmit={handleTeacherLogin} class="space-y-4">
                                        <div>
                                            <label class="block text-xs font-bold text-slate-700 mb-1">Lehrer-Passwort</label>
                                            <input 
                                                type="password"
                                                placeholder="••••••••"
                                                value={teacherPasswordInput}
                                                onChange={(e) => setTeacherPasswordInput(e.target.value)}
                                                class="w-full text-sm border border-slate-200 rounded-2xl px-3.5 py-2.5 bg-slate-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-slate-600 font-medium"
                                            />
                                        </div>

                                        <button 
                                            type="submit"
                                            class="w-full bg-slate-900 hover:bg-black text-white font-bold py-2.5 rounded-2xl transition shadow-md text-sm">
                                            Lehrerbereich öffnen
                                        </button>
                                    </form>
                                </div>
                            </div>
                        )}

                        {/* Lehrer-Verwaltungskonsole */}
                        {currentUser?.role === 'teacher' && (
                            <div class="bg-slate-900 text-white rounded-3xl p-6 shadow-xl border border-slate-800 space-y-6">
                                <div class="flex flex-wrap justify-between items-center border-b border-slate-800 pb-4 gap-3">
                                    <div>
                                        <h3 class="text-lg font-black text-amber-400 flex items-center gap-2">
                                            ⚙️ Lehrer-Konsole (Klasse 8b)
                                        </h3>
                                        <p class="text-xs text-slate-400">Verwalte Guthaben, Kaufanträge und PIN-Codes der Schüler</p>
                                    </div>

                                    <button 
                                        onClick={handleResetAllData}
                                        class="text-xs bg-red-900/60 hover:bg-red-800 text-red-200 border border-red-700 px-3 py-1.5 rounded-xl font-medium transition">
                                        🔄 System zurücksetzen
                                    </button>
                                </div>

                                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    {/* Credits buchen / korrigieren */}
                                    <div class="bg-slate-800/90 p-5 rounded-2xl border border-slate-700 space-y-3">
                                        <h4 class="text-xs font-bold uppercase tracking-wider text-slate-300">💰 Credits buchen / korrigieren</h4>
                                        <TeacherCreditForm onAdd={handleAddCredits} />
                                    </div>

                                    {/* Passwort ändern */}
                                    <div class="bg-slate-800/90 p-5 rounded-2xl border border-slate-700 space-y-3">
                                        <h4 class="text-xs font-bold uppercase tracking-wider text-slate-300">🔐 Lehrer-Passwort ändern</h4>
                                        <TeacherPasswordForm 
                                            currentPw={teacherPassword} 
                                            onUpdate={(newPw) => {
                                                setTeacherPassword(newPw);
                                                showToastMessage('Lehrer-Passwort geändert!');
                                            }} 
                                        />
                                    </div>
                                </div>

                                {/* Schüler PIN-Verwaltung mit STRIKTEM SCHUTZ */}
                                <div class="bg-slate-800/90 p-5 rounded-2xl border border-slate-700 space-y-4">
                                    <div class="flex flex-wrap justify-between items-center gap-3">
                                        <div>
                                            <h4 class="text-xs font-bold uppercase tracking-wider text-slate-300">🔑 Schüler-PINs (Nur für Lehrkraft)</h4>
                                            <p class="text-[11px] text-slate-400">PINs sind auf der gesamten Schüler-Website unsichtbar.</p>
                                        </div>

                                        <button 
                                            onClick={() => setShowTeacherPins(!showTeacherPins)}
                                            class="text-xs bg-slate-700 hover:bg-slate-600 text-white px-3 py-1.5 rounded-xl font-bold border border-slate-600 transition flex items-center gap-2">
                                            <span>{showTeacherPins ? '🙈 PINs verdecken' : '👁️ PINs einblenden'}</span>
                                        </button>
                                    </div>

                                    {/* PIN Bearbeitung Dialog */}
                                    {editingStudent && (
                                        <div class="bg-slate-900 p-4 rounded-xl border border-indigo-500/50 flex flex-wrap items-center justify-between gap-3">
                                            <span class="text-xs font-bold text-indigo-300">PIN ändern für: {editingStudent.name}</span>
                                            <div class="flex items-center gap-2">
                                                <input 
                                                    type="text" 
                                                    id="newPinInputVal"
                                                    defaultValue={editingStudent.pin}
                                                    class="w-24 text-xs bg-slate-800 border border-slate-700 text-white rounded-lg px-2.5 py-1.5 font-mono text-center"
                                                />
                                                <button 
                                                    onClick={() => {
                                                        const input = document.getElementById('newPinInputVal');
                                                        handleUpdateStudentPin(editingStudent.id, input.value);
                                                    }}
                                                    class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs px-3 py-1.5 rounded-lg font-bold">
                                                    Speichern
                                                </button>
                                                <button 
                                                    onClick={() => setEditingStudent(null)}
                                                    class="text-slate-400 text-xs hover:text-white px-2">
                                                    Abbrechen
                                                </button>
                                            </div>
                                        </div>
                                    )}

                                    {/* Raster der 28 Schüler-PINs */}
                                    <div class="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-7 gap-2">
                                        {students.map(s => (
                                            <div key={s.id} class="bg-slate-900 p-2.5 rounded-xl border border-slate-800 flex flex-col justify-between">
                                                <span class="text-xs font-bold text-slate-200 truncate">{s.name}</span>
                                                <div class="flex items-center justify-between mt-1 pt-1 border-t border-slate-800">
                                                    <span class="font-mono text-xs font-bold text-indigo-400">
                                                        {showTeacherPins ? s.pin : '••••'}
                                                    </span>
                                                    <button 
                                                        onClick={() => setEditingStudent(s)}
                                                        title="PIN ändern"
                                                        class="text-[10px] text-slate-400 hover:text-indigo-300 font-semibold">
                                                        ✏️
                                                    </button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* Shop Übersicht */}
                        <div class="space-y-4">
                            <div class="flex justify-between items-center">
                                <div>
                                    <h2 class="text-xl font-extrabold text-slate-800 flex items-center gap-2">
                                        🛍️ Shop & Belohnungen
                                    </h2>
                                    <p class="text-xs text-slate-500">Kaufvortrag starten • Erfordert 28/28 Zusagen</p>
                                </div>
                                <span class="text-xs font-bold bg-indigo-50 text-indigo-700 px-3 py-1 rounded-full border border-indigo-200">
                                    Guthaben: {credits} CR
                                </span>
                            </div>

                            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                                {SHOP_ITEMS.map(item => {
                                    const hasEnoughCredits = credits >= item.cost;
                                    const isCurrentRequest = activeRequest?.item.id === item.id;

                                    return (
                                        <div 
                                            key={item.id} 
                                            class={`bg-white rounded-3xl border p-5 flex flex-col justify-between transition shadow-sm relative ${
                                                isCurrentRequest 
                                                    ? 'ring-2 ring-amber-500 border-amber-400 bg-amber-50/20' 
                                                    : 'border-slate-200 hover:border-slate-300'
                                            }`}>
                                            <div>
                                                <div class="text-4xl mb-3">{item.icon}</div>
                                                <h3 class="font-extrabold text-slate-800 text-base">{item.title}</h3>
                                                <p class="text-xs text-slate-500 mt-1 leading-relaxed">{item.description}</p>
                                            </div>

                                            <div class="mt-6 pt-4 border-t border-slate-100 flex items-center justify-between">
                                                <div>
                                                    <span class="text-[10px] text-slate-400 uppercase tracking-wider block font-bold">Preis</span>
                                                    <span class="text-lg font-black text-indigo-600">{item.cost} CR</span>
                                                </div>

                                                <button 
                                                    disabled={!hasEnoughCredits || !!activeRequest}
                                                    onClick={() => handleProposePurchase(item)}
                                                    class={`px-3.5 py-2 rounded-2xl text-xs font-bold transition ${
                                                        isCurrentRequest
                                                            ? 'bg-amber-100 text-amber-800 border border-amber-300 cursor-default'
                                                            : hasEnoughCredits && !activeRequest
                                                            ? 'bg-indigo-600 hover:bg-indigo-700 text-white shadow-sm'
                                                            : 'bg-slate-100 text-slate-400 cursor-not-allowed border border-slate-200'
                                                    }`}>
                                                    {isCurrentRequest ? 'Läuft...' : hasEnoughCredits ? 'Kauf vorschlagen' : 'Zu wenig CR'}
                                                </button>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>

                        {/* Live Zusagen-Übersicht der 28 Schüler (NUR NAMEN & STATUS, KEINE PINS!) */}
                        {activeRequest && (
                            <div class="bg-white rounded-3xl border border-slate-200 p-6 shadow-sm space-y-4">
                                <div class="flex justify-between items-center border-b border-slate-100 pb-3">
                                    <div>
                                        <h3 class="font-extrabold text-slate-800 flex items-center gap-2">
                                            🗳️ Stimmliste der Klasse 8b (28 Schüler)
                                        </h3>
                                        <p class="text-xs text-slate-400">Zeigt den aktuellen Zustimmungs-Status der Mitschüler</p>
                                    </div>
                                    <span class="text-xs font-bold px-3 py-1 bg-slate-100 rounded-full text-slate-700">
                                        {activeRequest.approvals.size} / 28 Zusagen
                                    </span>
                                </div>

                                <div class="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-7 gap-2.5">
                                    {students.map(s => {
                                        const hasVoted = activeRequest.approvals.has(s.id);
                                        const isLoggedStudent = currentUser?.studentData?.id === s.id;

                                        return (
                                            <div 
                                                key={s.id} 
                                                class={`p-2.5 rounded-2xl border text-center transition text-xs flex flex-col items-center justify-between gap-1.5 ${
                                                    hasVoted 
                                                        ? 'bg-emerald-50 border-emerald-200 text-emerald-900 font-bold' 
                                                        : 'bg-slate-50 border-slate-200 text-slate-500 font-medium'
                                                } ${isLoggedStudent && !hasVoted ? 'ring-2 ring-indigo-500 bg-indigo-50/50' : ''}`}>
                                                <span class="truncate w-full">{s.name}</span>
                                                <span class="text-base">{hasVoted ? '✅' : '⏳'}</span>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        )}

                        {/* Untere Spalten: Klassenliste (Ohne PINs!) & Historie */}
                        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                            {/* Öffentliche Schülerliste der Klasse 8b */}
                            <div class="bg-white rounded-3xl border border-slate-200 p-6 shadow-sm space-y-3">
                                <div class="flex justify-between items-center border-b border-slate-100 pb-3">
                                    <h3 class="font-extrabold text-slate-800">
                                        👥 Schülerliste Klasse 8b (28 Schüler)
                                    </h3>
                                    <span class="text-[11px] text-slate-400 font-semibold">🔒 PINs geschützt</span>
                                </div>

                                <div class="max-h-72 overflow-y-auto custom-scrollbar space-y-1.5 pr-1">
                                    {students.map((s, idx) => (
                                        <div key={s.id} class="flex items-center justify-between p-2.5 hover:bg-slate-50 rounded-2xl text-xs border border-transparent hover:border-slate-100 transition">
                                            <div class="flex items-center gap-2.5">
                                                <span class="w-6 h-6 rounded-full bg-indigo-50 text-indigo-700 flex items-center justify-center font-bold text-[10px]">
                                                    {idx + 1}
                                                </span>
                                                <span class="font-bold text-slate-800">{s.name}</span>
                                            </div>
                                            <span class="text-slate-400 text-[11px] font-medium">Schüler/in Klasse 8b</span>
                                        </div>
                                    ))}
                                </div>
                            </div>

                            {/* Buchungs-Historie */}
                            <div class="bg-white rounded-3xl border border-slate-200 p-6 shadow-sm space-y-3">
                                <h3 class="font-extrabold text-slate-800 border-b border-slate-100 pb-3">
                                    📜 Transaktions-Historie
                                </h3>

                                <div class="max-h-72 overflow-y-auto custom-scrollbar space-y-2 pr-1">
                                    {history.map(item => (
                                        <div key={item.id} class="p-3 bg-slate-50 rounded-2xl border border-slate-100 text-xs flex justify-between items-start gap-2">
                                            <div>
                                                <p class="font-bold text-slate-800">{item.note}</p>
                                                <p class="text-[10px] text-slate-400 mt-0.5">{item.date} • {item.user}</p>
                                            </div>
                                            <span class={`font-black px-2.5 py-1 rounded-xl text-xs ${
                                                item.type === 'ADD' 
                                                    ? 'bg-emerald-100 text-emerald-800' 
                                                    : item.type === 'PURCHASE'
                                                    ? 'bg-indigo-100 text-indigo-800'
                                                    : 'bg-red-100 text-red-800'
                                            }`}>
                                                {item.type === 'ADD' ? '+' : '-'}{item.amount} CR
                                            </span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>

                    </main>

                    {/* Footer */}
                    <footer class="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-400 font-medium">
                        Klassenkonto Web App • Klasse 8b (28 Schüler) • Datenschutzkonform
                    </footer>
                </div>
            );
        }

        // Hilfskomponenten für Lehrer-Formulare
        function TeacherCreditForm({ onAdd }) {
            const [amount, setAmount] = useState('');
            const [note, setNote] = useState('');

            return (
                <div class="space-y-2.5">
                    <div class="flex gap-2">
                        <input 
                            type="number" 
                            placeholder="Betrag (z.B. 50)"
                            value={amount}
                            onChange={(e) => setAmount(e.target.value)}
                            class="w-1/2 text-xs bg-slate-900 border border-slate-700 text-white rounded-xl px-3 py-2 focus:outline-none focus:border-indigo-500 font-medium"
                        />
                        <input 
                            type="text" 
                            placeholder="Grund / Begründung"
                            value={note}
                            onChange={(e) => setNote(e.target.value)}
                            class="w-1/2 text-xs bg-slate-900 border border-slate-700 text-white rounded-xl px-3 py-2 focus:outline-none focus:border-indigo-500 font-medium"
                        />
                    </div>
                    <div class="flex gap-2 pt-1">
                        <button 
                            onClick={() => {
                                onAdd(parseInt(amount), note);
                                setAmount('');
                                setNote('');
                            }}
                            class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2 rounded-xl text-xs transition">
                            + Gutschreiben
                        </button>
                        <button 
                            onClick={() => {
                                onAdd(-Math.abs(parseInt(amount)), note);
                                setAmount('');
                                setNote('');
                            }}
                            class="bg-red-700 hover:bg-red-600 text-white font-bold px-3 py-2 rounded-xl text-xs transition">
                            - Abziehen
                        </button>
                    </div>
                </div>
            );
        }

        function TeacherPasswordForm({ currentPw, onUpdate }) {
            const [newPw, setNewPw] = useState('');

            return (
                <div class="space-y-2.5">
                    <div class="flex gap-2">
                        <input 
                            type="password" 
                            placeholder="Neues Passwort eingeben"
                            value={newPw}
                            onChange={(e) => setNewPw(e.target.value)}
                            class="flex-1 text-xs bg-slate-900 border border-slate-700 text-white rounded-xl px-3 py-2 focus:outline-none focus:border-indigo-500 font-medium"
                        />
                        <button 
                            onClick={() => {
                                if (newPw.trim()) {
                                    onUpdate(newPw.trim());
                                    setNewPw('');
                                }
                            }}
                            class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs px-4 py-2 rounded-xl font-bold transition">
                            Speichern
                        </button>
                    </div>
                    <p class="text-[10px] text-slate-400">Aktuelles Passwort: <span class="font-mono text-amber-300">{currentPw}</span></p>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
